<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E5C07B" />
    </linearGradient>
    <linearGradient id="hexCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56B6C2" />
      <stop offset="100%" stop-color="#1B9CFC" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="30" fill="#0C0F17" />

  <!-- Outer Interlocking Hexagons -->
  <polygon points="250,25 440,135 440,355 250,465 60,355 60,135" fill="none" stroke="url(#hexGold)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="250,45 422,145 422,345 250,445 78,345 78,145" fill="none" stroke="#21262D" stroke-width="2" />

  <!-- Geometric Abstract Aker Lions (Facets) -->
  <!-- Left Side Facets -->
  <polygon points="250,110 180,150 140,210 200,240 250,210" fill="#E5C07B" fill-opacity="0.2" stroke="url(#hexGold)" stroke-width="2.5" />
  <polygon points="140,210 100,270 160,300 200,240" fill="#56B6C2" fill-opacity="0.25" stroke="url(#hexCyan)" stroke-width="2.5" />
  <polygon points="160,300 200,350 250,330 200,240" fill="#E5C07B" fill-opacity="0.15" stroke="url(#hexGold)" stroke-width="2" />
  <polygon points="180,150 130,140 140,210" fill="#E5C07B" fill-opacity="0.3" stroke="url(#hexGold)" stroke-width="2" />
  <circle cx="150" cy="180" r="5" fill="#56B6C2" />

  <!-- Right Side Facets (Mirrored) -->
  <polygon points="250,110 320,150 360,210 300,240 250,210" fill="#E5C07B" fill-opacity="0.2" stroke="url(#hexGold)" stroke-width="2.5" />
  <polygon points="360,210 400,270 340,300 300,240" fill="#56B6C2" fill-opacity="0.25" stroke="url(#hexCyan)" stroke-width="2.5" />
  <polygon points="340,300 300,350 250,330 300,240" fill="#E5C07B" fill-opacity="0.15" stroke="url(#hexGold)" stroke-width="2" />
  <polygon points="320,150 370,140 360,210" fill="#E5C07B" fill-opacity="0.3" stroke="url(#hexGold)" stroke-width="2" />
  <circle cx="350" cy="180" r="5" fill="#56B6C2" />

  <!-- Center Triple-Factor Nexus Symbol (Password + TOTP + Telegram OTP) -->
  <polygon points="250,190 280,245 220,245" fill="none" stroke="url(#hexCyan)" stroke-width="4" stroke-linejoin="round" />
  <circle cx="250" cy="190" r="7" fill="url(#hexGold)" />
  <circle cx="280" cy="245" r="7" fill="url(#hexGold)" />
  <circle cx="220" cy="245" r="7" fill="url(#hexGold)" />
  <circle cx="250" cy="227" r="4" fill="#56B6C2" />

  <!-- Bottom Hex Banner -->
  <polygon points="180,390 320,390 340,420 160,420" fill="#161B22" stroke="url(#hexGold)" stroke-width="2" />
  <text x="250" y="411" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="5" fill="url(#hexGold)" text-anchor="middle">AKERGATE</text>
</svg>
