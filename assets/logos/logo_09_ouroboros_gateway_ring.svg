<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background (100% Flat Solid Color) -->
  <rect width="500" height="500" rx="32" fill="#0A0E17" />

  <!-- Outer Protective Seal Ring / Coin Rim -->
  <circle cx="250" cy="250" r="225" fill="#131A26" stroke="#E5C07B" stroke-width="4" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#222E42" stroke-width="2" stroke-dasharray="6 4" />
  
  <!-- Outer Ouroboros 60-Second Segment Ticks (Temporal TOTP Windows) -->
  <g stroke="#56B6C2" stroke-width="3" stroke-linecap="round">
    <!-- 12 Cardinal and Sub-cardinal Hour Ticks -->
    <line x1="250" y1="42" x2="250" y2="54" />
    <line x1="354" y1="70" x2="348" y2="80" />
    <line x1="430" y1="146" x2="420" y2="152" />
    <line x1="458" y1="250" x2="446" y2="250" />
    <line x1="430" y1="354" x2="420" y2="348" />
    <line x1="354" y1="430" x2="348" y2="420" />
    <line x1="250" y1="458" x2="250" y2="446" />
    <line x1="146" y1="430" x2="152" y2="420" />
    <line x1="70" y1="354" x2="80" y2="348" />
    <line x1="42" y1="250" x2="54" y2="250" />
    <line x1="70" y1="146" x2="80" y2="152" />
    <line x1="146" y1="70" x2="152" y2="80" />
  </g>

  <!-- Inner Seal Medallion Body -->
  <circle cx="250" cy="250" r="192" fill="#0D131F" stroke="#E5C07B" stroke-width="2" />

  <!-- Base Ground Line (Egyptian 'Ta' Hieroglyphic Earth Bar) -->
  <rect x="75" y="325" width="350" height="12" rx="4" fill="#E5C07B" />
  <rect x="95" y="342" width="310" height="4" fill="#56B6C2" />

  <!-- ==================== TWIN SENTINEL LIONS ==================== -->

  <!-- LEFT LION: Yesterday / Sef (Facing West/Left) -->
  <g>
    <!-- Recumbent Body & Haunch -->
    <path d="M 230,325 L 230,265 C 215,250 190,245 165,245 C 145,245 130,255 120,270 L 120,325 Z" 
          fill="#1A2433" stroke="#E5C07B" stroke-width="2" />
    
    <!-- Forward Resting Foreleg & Paw Extending Left -->
    <path d="M 120,300 L 75,300 C 65,300 60,312 60,325 L 120,325 Z" 
          fill="#1A2433" stroke="#E5C07B" stroke-width="2.5" />
    <!-- Claws/Paw digits -->
    <line x1="72" y1="315" x2="72" y2="325" stroke="#E5C07B" stroke-width="2" />
    <line x1="84" y1="315" x2="84" y2="325" stroke="#E5C07B" stroke-width="2" />

    <!-- Lion Mane (Thick Layered Pharaonic Crest) -->
    <path d="M 205,245 C 205,200 175,175 145,175 C 130,175 115,182 105,195 C 120,205 125,225 125,245 C 125,270 145,295 175,295 C 195,295 205,275 205,245 Z" 
          fill="#2A384C" stroke="#E5C07B" stroke-width="2.5" />
    <path d="M 180,215 C 170,195 150,188 135,190 C 145,205 150,225 155,250 C 165,250 178,235 180,215 Z" 
          fill="#E5C07B" />

    <!-- Lion Head & Snout (Noble Profile) -->
    <path d="M 135,185 C 120,185 105,192 95,202 L 70,205 C 65,205 60,210 60,218 L 65,228 C 72,238 85,240 100,240 L 115,240 C 125,230 130,215 135,185 Z" 
          fill="#E5C07B" stroke="#0D131F" stroke-width="2" />
    
    <!-- Lion Nose & Whisker Pad -->
    <polygon points="60,218 68,218 65,226" fill="#0D131F" />
    <line x1="72" y1="228" x2="88" y2="228" stroke="#0D131F" stroke-width="2" stroke-linecap="round" />

    <!-- Lion Ear -->
    <path d="M 125,180 C 125,168 135,165 140,175 C 138,185 130,188 125,180 Z" 
          fill="#E5C07B" stroke="#0D131F" stroke-width="2" />
    <circle cx="132" cy="176" r="3" fill="#56B6C2" />

    <!-- Lion Eye (Cyan Focus) -->
    <polygon points="96,208 108,206 102,214" fill="#0D131F" />
    <polygon points="98,208 106,207 102,212" fill="#56B6C2" />
  </g>

  <!-- RIGHT LION: Tomorrow / Duau (Facing East/Right) - Mirrored -->
  <g>
    <!-- Recumbent Body & Haunch -->
    <path d="M 270,325 L 270,265 C 285,250 310,245 335,245 C 355,245 370,255 380,270 L 380,325 Z" 
          fill="#1A2433" stroke="#E5C07B" stroke-width="2" />
    
    <!-- Forward Resting Foreleg & Paw Extending Right -->
    <path d="M 380,300 L 425,300 C 435,300 440,312 440,325 L 380,325 Z" 
          fill="#1A2433" stroke="#E5C07B" stroke-width="2.5" />
    <!-- Claws/Paw digits -->
    <line x1="428" y1="315" x2="428" y2="325" stroke="#E5C07B" stroke-width="2" />
    <line x1="416" y1="315" x2="416" y2="325" stroke="#E5C07B" stroke-width="2" />

    <!-- Lion Mane (Thick Layered Pharaonic Crest) -->
    <path d="M 295,245 C 295,200 325,175 355,175 C 370,175 385,182 395,195 C 380,205 375,225 375,245 C 375,270 355,295 325,295 C 305,295 295,275 295,245 Z" 
          fill="#2A384C" stroke="#E5C07B" stroke-width="2.5" />
    <path d="M 320,215 C 330,195 350,188 365,190 C 355,205 350,225 345,250 C 335,250 322,235 320,215 Z" 
          fill="#E5C07B" />

    <!-- Lion Head & Snout (Noble Profile) -->
    <path d="M 365,185 C 380,185 395,192 405,202 L 430,205 C 435,205 440,210 440,218 L 435,228 C 428,238 415,240 400,240 L 385,240 C 375,230 370,215 365,185 Z" 
          fill="#E5C07B" stroke="#0D131F" stroke-width="2" />
    
    <!-- Lion Nose & Whisker Pad -->
    <polygon points="440,218 432,218 435,226" fill="#0D131F" />
    <line x1="428" y1="228" x2="412" y2="228" stroke="#0D131F" stroke-width="2" stroke-linecap="round" />

    <!-- Lion Ear -->
    <path d="M 375,180 C 375,168 365,165 360,175 C 362,185 370,188 375,180 Z" 
          fill="#E5C07B" stroke="#0D131F" stroke-width="2" />
    <circle cx="368" cy="176" r="3" fill="#56B6C2" />

    <!-- Lion Eye (Cyan Focus) -->
    <polygon points="404,208 392,206 398,214" fill="#0D131F" />
    <polygon points="402,208 394,207 398,212" fill="#56B6C2" />
  </g>

  <!-- ==================== CENTRAL HORIZON PORTAL ==================== -->
  <!-- Architectural Gateway Pylon (Between the Backs of the Lions) -->
  <polygon points="215,325 225,210 275,210 285,325" fill="#151E2B" stroke="#E5C07B" stroke-width="3" />
  
  <!-- Gateway Cornice Header -->
  <polygon points="210,210 290,210 295,198 205,198" fill="#E5C07B" />

  <!-- Security Keyhole Portal Doorway -->
  <path d="M 235,325 L 235,270 C 235,260 265,260 265,270 L 265,325 Z" fill="#0A0E17" stroke="#56B6C2" stroke-width="2" />
  <circle cx="250" cy="272" r="7" fill="#56B6C2" />
  <polygon points="247,272 253,272 255,292 245,292" fill="#56B6C2" />

  <!-- Radiant Solar Horizon Disc (Emerging Above Gateway) -->
  <circle cx="250" cy="155" r="28" fill="#E5C07B" stroke="#0D131F" stroke-width="3" />
  <circle cx="250" cy="155" r="16" fill="#0D131F" />
  <circle cx="250" cy="155" r="9" fill="#56B6C2" />

  <!-- Solar Corona Rays (Solid Sharp Geometric Rays) -->
  <g stroke="#E5C07B" stroke-width="3" stroke-linecap="round">
    <line x1="250" y1="115" x2="250" y2="102" />
    <line x1="220" y1="125" x2="210" y2="115" />
    <line x1="280" y1="125" x2="290" y2="115" />
    <line x1="200" y1="155" x2="188" y2="155" />
    <line x1="300" y1="155" x2="312" y2="155" />
  </g>

  <!-- ==================== TYPOGRAPHY & SUBTITLE ==================== -->
  <text x="250" y="385" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="8" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
  <text x="250" y="410" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#56B6C2" text-anchor="middle">OUROBOROS TEMPORAL SEAL</text>
</svg>