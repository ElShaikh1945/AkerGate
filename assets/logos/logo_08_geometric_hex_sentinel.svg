  <text x="250" y="404" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="6" fill="#E5C07B" text-anchor="middle">AKERGATE</text>

  <text x="250" y="438" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#56B6C2" text-anchor="middle">GEOMETRIC SENTINEL HEX</text>
