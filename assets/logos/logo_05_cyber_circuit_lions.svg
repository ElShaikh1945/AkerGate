<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="circGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#E5C07B" />
    </linearGradient>
    <linearGradient id="circBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61AFEF" />
      <stop offset="100%" stop-color="#56B6C2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0D1117" />
  
  <!-- Subtle Circuit Grid Background -->
  <g stroke="#1F242C" stroke-width="1.5">
    <line x1="50" y1="100" x2="450" y2="100" />
    <line x1="50" y1="250" x2="450" y2="250" />
    <line x1="50" y1="400" x2="450" y2="400" />
    <line x1="100" y1="50" x2="100" y2="450" />
    <line x1="250" y1="50" x2="250" y2="450" />
    <line x1="400" y1="50" x2="400" y2="450" />
  </g>

  <!-- Central Authentication Nexus (Hex Core) -->
  <polygon points="250,170 300,200 300,260 250,290 200,260 200,200" fill="#161B22" stroke="url(#circBlue)" stroke-width="4" />
  <circle cx="250" cy="230" r="16" fill="none" stroke="url(#circGold)" stroke-width="3" />
  <circle cx="250" cy="230" r="6" fill="url(#circGold)" />

  <!-- Radiating 3-Factor Nexus Lines (Password, TOTP, Telegram) -->
  <line x1="250" y1="170" x2="250" y2="110" stroke="url(#circBlue)" stroke-width="3" stroke-linecap="round" />
  <circle cx="250" cy="110" r="5" fill="url(#circBlue)" />

  <line x1="200" y1="260" x2="150" y2="300" stroke="url(#circBlue)" stroke-width="3" stroke-linecap="round" />
  <circle cx="150" cy="300" r="5" fill="url(#circBlue)" />

  <line x1="300" y1="260" x2="350" y2="300" stroke="url(#circBlue)" stroke-width="3" stroke-linecap="round" />
  <circle cx="350" cy="300" r="5" fill="url(#circBlue)" />

  <!-- Left Circuit Lion Traces (Looking West) -->
  <g stroke="url(#circGold)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200,200 L 150,170 L 120,130 L 90,130 L 70,160 L 90,190 L 130,200" />
    <path d="M 120,130 L 130,90 L 160,110 L 150,170" />
    <path d="M 70,160 L 50,190 L 70,220 L 110,230 L 110,280 L 150,300" />
    <path d="M 90,190 L 105,190" />
    <circle cx="90" cy="130" r="4" fill="url(#circGold)" />
    <circle cx="130" cy="90" r="4" fill="url(#circGold)" />
    <circle cx="50" cy="190" r="4" fill="url(#circGold)" />
    <!-- Lion Eye Node -->
    <circle cx="100" cy="165" r="5" fill="#56B6C2" stroke="none" />
  </g>

  <!-- Right Circuit Lion Traces (Looking East - Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" stroke="url(#circGold)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200,200 L 150,170 L 120,130 L 90,130 L 70,160 L 90,190 L 130,200" />
    <path d="M 120,130 L 130,90 L 160,110 L 150,170" />
    <path d="M 70,160 L 50,190 L 70,220 L 110,230 L 110,280 L 150,300" />
    <path d="M 90,190 L 105,190" />
    <circle cx="90" cy="130" r="4" fill="url(#circGold)" />
    <circle cx="130" cy="90" r="4" fill="url(#circGold)" />
    <circle cx="50" cy="190" r="4" fill="url(#circGold)" />
    <!-- Lion Eye Node -->
    <circle cx="100" cy="165" r="5" fill="#56B6C2" stroke="none" />
  </g>

  <!-- Lower Base Horizon Bar -->
  <line x1="80" y1="360" x2="420" y2="360" stroke="url(#circGold)" stroke-width="4" stroke-linecap="round" />
  <circle cx="80" cy="360" r="6" fill="url(#circGold)" />
  <circle cx="420" cy="360" r="6" fill="url(#circGold)" />

  <!-- Bottom Tech Inscription -->
  <text x="250" y="420" font-family="'Courier New', monospace" font-size="20" font-weight="bold" letter-spacing="8" fill="url(#circGold)" text-anchor="middle">&lt;AKER_GATE/&gt;</text>
  <text x="250" y="445" font-family="'Courier New', monospace" font-size="11" letter-spacing="4" fill="#8B949E" text-anchor="middle">PAM_SEC_LEVEL::MAX</text>
</svg>
