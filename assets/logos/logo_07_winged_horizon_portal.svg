<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Concept: Winged Horizon Portal -->
  <rect width="500" height="500" rx="20" fill="#0C121D" />

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#E5C07B" stroke-width="4" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="#25354D" stroke-width="2" stroke-dasharray="6 6" />

  <!-- The Winged Solar Bar (Behedeti Wings) in Solid Flat Layers -->
  <!-- Left Wing Plumes -->
  <path d="M 250,140 C 180,100 110,120 40,180 C 100,175 160,185 200,205 Z" fill="#E5C07B" />
  <path d="M 230,165 C 180,145 130,160 70,210 C 120,205 170,210 205,225 Z" fill="#56B6C2" />

  <!-- Right Wing Plumes -->
  <path d="M 250,140 C 320,100 390,120 460,180 C 400,175 340,185 300,205 Z" fill="#E5C07B" />
  <path d="M 270,165 C 320,145 370,160 430,210 C 380,205 330,210 295,225 Z" fill="#56B6C2" />

  <!-- Left Lion Sentinel (Bold Flat Profile) -->
  <g fill="#E5C07B" stroke="#0C121D" stroke-width="2">
    <path d="M 195,230 C 175,215 155,220 135,235 C 120,245 115,260 125,275 C 115,285 120,305 135,315 L 195,315 Z" />
    <polygon points="180,210 190,195 170,200" />
    <circle cx="145" cy="250" r="4" fill="#0C121D" />
  </g>

  <!-- Right Lion Sentinel (Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="#E5C07B" stroke="#0C121D" stroke-width="2">
    <path d="M 195,230 C 175,215 155,220 135,235 C 120,245 115,260 125,275 C 115,285 120,305 135,315 L 195,315 Z" />
    <polygon points="180,210 190,195 170,200" />
    <circle cx="145" cy="250" r="4" fill="#0C121D" />
  </g>

  <!-- Center Portal Sun Disc -->
  <circle cx="250" cy="250" r="45" fill="#0C121D" stroke="#E5C07B" stroke-width="6" />
  <circle cx="250" cy="250" r="22" fill="#56B6C2" />
  <!-- Center Keyhole Silhouette -->
  <circle cx="250" cy="245" r="7" fill="#0C121D" />
  <polygon points="246,248 254,248 256,262 244,262" fill="#0C121D" />

  <!-- Ground Pedestal -->
  <rect x="100" y="340" width="300" height="12" fill="#E5C07B" />
  
  <text x="250" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
  <text x="250" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="4" fill="#56B6C2" text-anchor="middle">HORIZON WINGED DEFENSE</text>
</svg>
