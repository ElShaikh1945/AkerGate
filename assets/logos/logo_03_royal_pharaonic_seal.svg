<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Obsidian Black Background -->
  <rect width="500" height="500" fill="#0A0D14" />

  <!-- Circular Outer Stamp Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#E5C07B" stroke-width="6" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#E5C07B" stroke-width="2" />
  <circle cx="250" cy="250" r="165" fill="none" stroke="#E5C07B" stroke-width="3" />
  <circle cx="250" cy="250" r="156" fill="none" stroke="#56B6C2" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Perimeter Stamp Text -->
  <path id="sealPathTop" d="M 60,250 A 190,190 0 0,1 440,250" fill="none" />
  <path id="sealPathBtm" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />
  <text font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" letter-spacing="5" fill="#E5C07B">
    <textPath href="#sealPathTop" startOffset="50%" text-anchor="middle">* AKERGATE PAM GATEWAY *</textPath>
  </text>
  <text font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" letter-spacing="4" fill="#56B6C2">
    <textPath href="#sealPathBtm" startOffset="50%" text-anchor="middle">OFFICIAL AUTHENTICATION SEAL</textPath>
  </text>

  <!-- Central Earth Pedestal (The Horizon Base) -->
  <rect x="150" y="300" width="200" height="10" fill="#E5C07B" />
  <line x1="165" y1="316" x2="335" y2="316" stroke="#56B6C2" stroke-width="2" />

  <!-- Central Keyhole Gateway Tower -->
  <rect x="235" y="180" width="30" height="120" fill="#151D28" stroke="#E5C07B" stroke-width="2" />
  <circle cx="250" cy="215" r="8" fill="#56B6C2" />
  <polygon points="248,220 252,220 254,238 246,238" fill="#56B6C2" />

  <!-- LEFT RECUMBENT LION (Sef - Yesterday) -->
  <g fill="#E5C07B" stroke="#0A0D14" stroke-width="2">
    <!-- Body & Paw resting forward -->
    <path d="M 235,300 L 150,300 C 140,300 135,295 135,285 C 135,280 140,275 150,275 L 180,275 L 195,245 L 235,245 Z" />
    <!-- Claws/Digits -->
    <line x1="142" y1="285" x2="142" y2="300" stroke="#0A0D14" stroke-width="2" />
    <line x1="148" y1="285" x2="148" y2="300" stroke="#0A0D14" stroke-width="2" />

    <!-- Lion Head / Egyptian Stylized Mane -->
    <path d="M 235,245 C 215,240 200,225 190,205 C 180,185 185,160 170,145 C 160,135 140,140 135,155 C 120,165 110,185 125,200 C 135,210 145,210 160,205 C 160,225 175,240 190,250" />
    <!-- Lion Face: Snout, Whiskers, Jaw -->
    <path d="M 160,145 C 145,145 130,155 120,170 C 110,180 95,185 90,195 C 85,205 95,210 105,210 C 115,210 120,205 130,200 L 140,215" />
    <!-- Ear -->
    <path d="M 160,135 C 160,120 175,120 175,135 Z" fill="#E5C07B" />
    <!-- Eye -->
    <polygon points="135,170 145,165 140,175" fill="#0A0D14" />
    <!-- Nose -->
    <polygon points="95,190 102,190 98,197" fill="#0A0D14" />
  </g>

  <!-- RIGHT RECUMBENT LION (Duau - Tomorrow - Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="#E5C07B" stroke="#0A0D14" stroke-width="2">
    <path d="M 235,300 L 150,300 C 140,300 135,295 135,285 C 135,280 140,275 150,275 L 180,275 L 195,245 L 235,245 Z" />
    <line x1="142" y1="285" x2="142" y2="300" stroke="#0A0D14" stroke-width="2" />
    <line x1="148" y1="285" x2="148" y2="300" stroke="#0A0D14" stroke-width="2" />

    <path d="M 235,245 C 215,240 200,225 190,205 C 180,185 185,160 170,145 C 160,135 140,140 135,155 C 120,165 110,185 125,200 C 135,210 145,210 160,205 C 160,225 175,240 190,250" />
    <path d="M 160,145 C 145,145 130,155 120,170 C 110,180 95,185 90,195 C 85,205 95,210 105,210 C 115,210 120,205 130,200 L 140,215" />
    <path d="M 160,135 C 160,120 175,120 175,135 Z" fill="#E5C07B" />
    <polygon points="135,170 145,165 140,175" fill="#0A0D14" />
    <polygon points="95,190 102,190 98,197" fill="#0A0D14" />
  </g>

  <!-- Crown Solar Disc above Keyhole Tower -->
  <circle cx="250" cy="155" r="16" fill="#E5C07B" stroke="#0A0D14" stroke-width="2" />
  <circle cx="250" cy="155" r="6" fill="#0A0D14" />
</svg>
