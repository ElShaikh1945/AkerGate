<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Minimal Background -->
  <rect width="500" height="500" rx="36" fill="#090D12" />

  <!-- Single Continuous Monoline Weight = 7px -->
  <!-- Left Lion & Horizon Arc -->
  <path d="M 120,350 L 150,350 C 180,350 200,330 200,290 C 200,250 180,240 160,230 C 140,220 120,200 120,170 C 120,130 150,110 185,110 C 210,110 225,125 230,145" 
        fill="none" stroke="#E5C07B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Lion & Horizon Arc (Symmetrical) -->
  <path d="M 380,350 L 350,350 C 320,350 300,330 300,290 C 300,250 320,240 340,230 C 360,220 380,200 380,170 C 380,130 350,110 315,110 C 290,110 275,125 270,145" 
        fill="none" stroke="#E5C07B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Left Lion Eye -->
  <circle cx="160" cy="155" r="7" fill="#56B6C2" />

  <!-- Right Lion Eye -->
  <circle cx="340" cy="155" r="7" fill="#56B6C2" />

  <!-- Central Rising Solar Disc (Horizon Portal) -->
  <circle cx="250" cy="195" r="34" fill="none" stroke="#56B6C2" stroke-width="7" />
  <circle cx="250" cy="195" r="14" fill="#E5C07B" />

  <!-- Central Gateway Keyhole / Pillar -->
  <line x1="250" y1="240" x2="250" y2="350" stroke="#E5C07B" stroke-width="7" stroke-linecap="round" />

  <!-- Bottom Horizon Ground Line -->
  <line x1="90" y1="350" x2="410" y2="350" stroke="#E5C07B" stroke-width="7" stroke-linecap="round" />

  <!-- Clean Minimalist Wordmark -->
  <text x="250" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="10" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
</svg>
