<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Monochrome / High-Contrast Stamp Design -->
  <!-- Dark Sandstone Background -->
  <rect width="500" height="500" rx="20" fill="#12161E" />
  
  <!-- Outer Rounded Stamp Border with Hieroglyphic Rope Knot border -->
  <rect x="25" y="25" width="450" height="450" rx="30" fill="none" stroke="#E5C07B" stroke-width="5" />
  <rect x="35" y="35" width="430" height="430" rx="22" fill="none" stroke="#E5C07B" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Authentic Aker Relief Representation -->
  <!-- The Earth Strip (Hieroglyph N16: 'Ta' / 𓇾) -->
  <path d="M 80,330 L 420,330 C 400,360 360,370 250,370 C 140,370 100,360 80,330 Z" fill="#E5C07B" />
  <line x1="110" y1="345" x2="390" y2="345" stroke="#12161E" stroke-width="3" stroke-dasharray="12 8" />

  <!-- The Horizon Sun (Ra / Aten disc) -->
  <circle cx="250" cy="210" r="38" fill="#E5C07B" />
  <circle cx="250" cy="210" r="28" fill="#12161E" />
  <circle cx="250" cy="210" r="14" fill="#E5C07B" />

  <!-- Twin Back-to-Back Sphinx/Lion Reliefs of Sef & Duau -->
  <!-- Left Lion (Sef / Yesterday) -->
  <path d="M 235,320 L 120,320 C 100,320 85,305 85,285 C 85,260 110,240 130,240 C 145,240 155,250 165,250 C 170,230 185,200 205,170 C 190,165 175,170 160,180 C 150,170 155,150 170,140 C 185,130 205,135 215,145 C 220,135 235,135 240,145 L 245,200 L 235,270 Z" 
        fill="#E5C07B" />
  <!-- Left Lion Eye Cutout -->
  <polygon points="180,155 192,158 182,165" fill="#12161E" />

  <!-- Right Lion (Duau / Tomorrow - Mirrored) -->
  <path d="M 265,320 L 380,320 C 400,320 415,305 415,285 C 415,260 390,240 370,240 C 355,240 345,250 335,250 C 330,230 315,200 295,170 C 310,165 325,170 340,180 C 350,170 345,150 330,140 C 315,130 295,135 285,145 C 280,135 265,135 260,145 L 255,200 L 265,270 Z" 
        fill="#E5C07B" />
  <!-- Right Lion Eye Cutout -->
  <polygon points="320,155 308,158 318,165" fill="#12161E" />

  <!-- Cartouche Oval Header Badge -->
  <rect x="140" y="55" width="220" height="42" rx="21" fill="none" stroke="#E5C07B" stroke-width="3.5" />
  <line x1="130" y1="55" x2="130" y2="97" stroke="#E5C07B" stroke-width="4" stroke-linecap="round" />
  <text x="250" y="83" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="6" fill="#E5C07B" text-anchor="middle">AKER</text>

  <!-- Bottom Stamp Text -->
  <text x="250" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="7" fill="#E5C07B" text-anchor="middle">LINUX AUTHENTICATION</text>
  <text x="250" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#8B949E" text-anchor="middle">HORIZON GUARDIAN SYSTEM</text>
</svg>
