<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Concept: Authentic Egyptian Relief Carving Stamp -->
  <rect width="500" height="500" rx="20" fill="#111620" />

  <!-- Outer Double Cartouche Border -->
  <rect x="30" y="30" width="440" height="440" rx="30" fill="none" stroke="#E5C07B" stroke-width="5" />
  <rect x="40" y="40" width="420" height="420" rx="20" fill="none" stroke="#232F42" stroke-width="2" />

  <!-- Top Cartouche Header -->
  <rect x="150" y="55" width="200" height="38" rx="19" fill="#111620" stroke="#E5C07B" stroke-width="3" />
  <line x1="135" y1="55" x2="135" y2="93" stroke="#E5C07B" stroke-width="5" stroke-linecap="round" />
  <text x="250" y="81" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="6" fill="#E5C07B" text-anchor="middle">AKER</text>

  <!-- Central Solar Disc of Ra/Horizon -->
  <circle cx="250" cy="180" r="32" fill="#E5C07B" stroke="#111620" stroke-width="3" />
  <circle cx="250" cy="180" r="16" fill="#111620" />
  <rect x="247" y="172" width="6" height="30" fill="#E5C07B" />

  <!-- Central Double-Lion Body Joined at the Back (Classic Book of the Dead Spell 17) -->
  <!-- Left Lion Torso & Foreleg -->
  <path d="M 245,300 L 110,300 C 95,300 85,290 85,275 C 85,255 105,245 125,245 L 155,245 C 160,225 175,190 195,160 C 180,150 160,155 145,170 C 135,160 140,140 155,130 C 170,120 190,125 200,135 L 205,115 C 215,115 225,125 225,135 L 245,190 Z" 
        fill="#E5C07B" stroke="#111620" stroke-width="2" />
  <!-- Left Lion Face Cutouts -->
  <polygon points="170,145 182,148 174,155" fill="#111620" />
  <path d="M 125,245 C 115,245 105,255 105,270 C 105,280 115,285 125,285" fill="none" stroke="#111620" stroke-width="2.5" />
  <!-- Left Lion Ear -->
  <polygon points="200,120 210,105 195,110" fill="#E5C07B" stroke="#111620" stroke-width="1.5" />

  <!-- Right Lion Torso & Foreleg (Mirrored) -->
  <path d="M 255,300 L 390,300 C 405,300 415,290 415,275 C 415,255 395,245 375,245 L 345,245 C 340,225 325,190 305,160 C 320,150 340,155 355,170 C 365,160 360,140 345,130 C 330,120 310,125 300,135 L 295,115 C 285,115 275,125 275,135 L 255,190 Z" 
        fill="#E5C07B" stroke="#111620" stroke-width="2" />
  <!-- Right Lion Face Cutouts -->
  <polygon points="330,145 318,148 326,155" fill="#111620" />
  <path d="M 375,245 C 385,245 395,255 395,270 C 395,280 385,285 375,285" fill="none" stroke="#111620" stroke-width="2.5" />
  <!-- Right Lion Ear -->
  <polygon points="300,120 290,105 305,110" fill="#E5C07B" stroke="#111620" stroke-width="1.5" />

  <!-- The Horizon Earth Base ('Ta' Glyph Strip) -->
  <rect x="75" y="305" width="350" height="18" fill="#E5C07B" />
  <line x1="90" y1="335" x2="410" y2="335" stroke="#E5C07B" stroke-width="3" />

  <!-- Inscription -->
  <text x="250" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
  <text x="250" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#8B949E" text-anchor="middle">SEF &amp; DUAU • PAM GUARDIAN</text>
</svg>
