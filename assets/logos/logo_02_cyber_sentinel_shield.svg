<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF78" />
      <stop offset="60%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>
    <linearGradient id="shieldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61AFEF" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <radialGradient id="shieldDark" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1B222D" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>
  </defs>

  <!-- Hexagonal Shield Outer Body -->
  <polygon points="250,30 430,110 430,320 250,470 70,320 70,110" fill="url(#shieldDark)" stroke="url(#shieldGold)" stroke-width="5" stroke-linejoin="round" />
  <polygon points="250,50 410,122 410,310 250,446 90,310 90,122" fill="none" stroke="#30363D" stroke-width="2" />

  <!-- Geometric Lion Sentinel of Aker -->
  <!-- Left Half -->
  <path d="M 250,100 L 210,130 L 170,115 L 140,165 L 160,200 L 130,235 L 175,270 L 210,240 L 250,290" 
        fill="none" stroke="url(#shieldGold)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="170,115 190,160 140,165" fill="#E5C07B" fill-opacity="0.15" stroke="url(#shieldGold)" stroke-width="2" />
  <polygon points="190,160 250,100 210,130" fill="#E5C07B" fill-opacity="0.25" stroke="url(#shieldGold)" stroke-width="2" />
  <polygon points="190,160 210,240 160,200" fill="#56B6C2" fill-opacity="0.2" stroke="url(#shieldCyan)" stroke-width="2" />
  <polygon points="160,200 175,270 130,235" fill="#E5C07B" fill-opacity="0.1" stroke="url(#shieldGold)" stroke-width="2" />

  <!-- Right Half (Mirrored) -->
  <path d="M 250,100 L 290,130 L 330,115 L 360,165 L 340,200 L 370,235 L 325,270 L 290,240 L 250,290" 
        fill="none" stroke="url(#shieldGold)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="330,115 310,160 360,165" fill="#E5C07B" fill-opacity="0.15" stroke="url(#shieldGold)" stroke-width="2" />
  <polygon points="310,160 250,100 290,130" fill="#E5C07B" fill-opacity="0.25" stroke="url(#shieldGold)" stroke-width="2" />
  <polygon points="310,160 290,240 340,200" fill="#56B6C2" fill-opacity="0.2" stroke="url(#shieldCyan)" stroke-width="2" />
  <polygon points="340,200 325,270 370,235" fill="#E5C07B" fill-opacity="0.1" stroke="url(#shieldGold)" stroke-width="2" />

  <!-- Central Sentinel Eye / Cyber Core -->
  <circle cx="250" cy="210" r="18" fill="url(#shieldDark)" stroke="url(#shieldCyan)" stroke-width="3" />
  <circle cx="250" cy="210" r="8" fill="url(#shieldCyan)" />
  <line x1="250" y1="130" x2="250" y2="190" stroke="url(#shieldCyan)" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Dual Horizon Gateway Pedestal (Aker Mountains) -->
  <path d="M 180,350 L 215,310 L 250,335 L 285,310 L 320,350" fill="none" stroke="url(#shieldGold)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Circuit Nodes connecting to Gateway bottom -->
  <line x1="250" y1="335" x2="250" y2="400" stroke="url(#shieldCyan)" stroke-width="3" />
  <circle cx="250" cy="400" r="6" fill="url(#shieldCyan)" />
  <line x1="215" y1="350" x2="190" y2="385" stroke="url(#shieldGold)" stroke-width="2" />
  <circle cx="190" cy="385" r="4" fill="url(#shieldGold)" />
  <line x1="285" y1="350" x2="310" y2="385" stroke="url(#shieldGold)" stroke-width="2" />
  <circle cx="310" cy="385" r="4" fill="url(#shieldGold)" />

  <!-- Monogram Label -->
  <text x="250" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="6" fill="url(#shieldGold)" text-anchor="middle">AKERGATE</text>
</svg>
