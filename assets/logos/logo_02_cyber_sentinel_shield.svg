<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Dark Background -->
  <rect width="500" height="500" rx="20" fill="#0A0E17" />

  <!-- Shield Outer Border -->
  <path d="M 250,30 L 430,90 L 430,270 C 430,370 340,440 250,470 C 160,440 70,370 70,270 L 70,90 Z" 
        fill="#131B26" stroke="#E5C07B" stroke-width="6" stroke-linejoin="round" />
  <path d="M 250,48 L 412,102 L 412,265 C 412,355 330,420 250,448 C 170,420 88,355 88,265 L 88,102 Z" 
        fill="none" stroke="#253346" stroke-width="2" />

  <!-- Central Fortified Vault Door -->
  <rect x="220" y="160" width="60" height="200" rx="4" fill="#0A0E17" stroke="#56B6C2" stroke-width="3" />
  <circle cx="250" cy="230" r="14" fill="#E5C07B" />
  <rect x="247" y="235" width="6" height="30" fill="#E5C07B" />

  <!-- LEFT ROARING LION HEAD (Looking West) -->
  <g fill="#E5C07B" stroke="#0A0E17" stroke-width="1.5">
    <!-- Mane Volume -->
    <path d="M 220,170 C 190,160 170,140 160,110 C 145,125 140,150 145,175 C 130,165 120,185 125,210 C 110,210 105,235 115,255 C 105,265 110,285 130,300 C 140,310 160,315 180,310 L 220,310 Z" />
    <!-- Lion Face / Snout / Open Jaw -->
    <path d="M 175,130 C 150,130 130,145 115,165 C 100,180 80,185 65,200 C 60,205 60,215 70,220 C 85,225 100,215 110,215 C 100,230 105,245 120,250 C 135,255 150,245 160,230" />
    <!-- Lion Ear -->
    <polygon points="175,130 185,105 165,115" />
    <!-- Eye -->
    <polygon points="135,170 150,165 142,175" fill="#0A0E17" />
    <circle cx="142" cy="170" r="2.5" fill="#56B6C2" />
    <!-- Fangs / Teeth -->
    <polygon points="85,218 92,228 97,218" fill="#FFFFFF" />
    <polygon points="98,235 104,226 108,235" fill="#FFFFFF" />
  </g>

  <!-- RIGHT ROARING LION HEAD (Looking East - Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="#E5C07B" stroke="#0A0E17" stroke-width="1.5">
    <path d="M 220,170 C 190,160 170,140 160,110 C 145,125 140,150 145,175 C 130,165 120,185 125,210 C 110,210 105,235 115,255 C 105,265 110,285 130,300 C 140,310 160,315 180,310 L 220,310 Z" />
    <path d="M 175,130 C 150,130 130,145 115,165 C 100,180 80,185 65,200 C 60,205 60,215 70,220 C 85,225 100,215 110,215 C 100,230 105,245 120,250 C 135,255 150,245 160,230" />
    <polygon points="175,130 185,105 165,115" />
    <polygon points="135,170 150,165 142,175" fill="#0A0E17" />
    <circle cx="142" cy="170" r="2.5" fill="#56B6C2" />
    <polygon points="85,218 92,228 97,218" fill="#FFFFFF" />
    <polygon points="98,235 104,226 108,235" fill="#FFFFFF" />
  </g>

  <!-- Bottom Banner Inscription -->
  <polygon points="150,380 350,380 370,415 130,415" fill="#0A0E17" stroke="#E5C07B" stroke-width="2.5" />
  <text x="250" y="404" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="6" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
</svg>
