<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Concept: The Grand Temple Pylon Gate of Aker -->
  <!-- Deep Blue/Obsidian Base -->
  <rect width="500" height="500" rx="20" fill="#090E17" />

  <!-- Outer Architectural Border -->
  <rect x="25" y="25" width="450" height="450" rx="10" fill="none" stroke="#E5C07B" stroke-width="4" />
  <rect x="35" y="35" width="430" height="430" rx="6" fill="none" stroke="#253346" stroke-width="1.5" />

  <!-- Left Egyptian Temple Pylon Tower (Trapezoidal Stone Citadel) -->
  <polygon points="60,380 100,160 210,160 210,380" fill="#131B26" stroke="#E5C07B" stroke-width="4" />
  <line x1="85" y1="200" x2="200" y2="200" stroke="#253346" stroke-width="2" />
  <line x1="75" y1="260" x2="205" y2="260" stroke="#253346" stroke-width="2" />
  <line x1="68" y1="320" x2="208" y2="320" stroke="#253346" stroke-width="2" />

  <!-- Right Egyptian Temple Pylon Tower (Mirrored) -->
  <polygon points="440,380 400,160 290,160 290,380" fill="#131B26" stroke="#E5C07B" stroke-width="4" />
  <line x1="415" y1="200" x2="300" y2="200" stroke="#253346" stroke-width="2" />
  <line x1="425" y1="260" x2="295" y2="260" stroke="#253346" stroke-width="2" />
  <line x1="432" y1="320" x2="292" y2="320" stroke="#253346" stroke-width="2" />

  <!-- The Open Central Portal Arch -->
  <rect x="210" y="210" width="80" height="170" fill="#090E17" stroke="#E5C07B" stroke-width="4" />
  <!-- Portal Cavetto Cornice (Egyptian architectural molding) -->
  <polygon points="195,210 305,210 295,190 205,190" fill="#E5C07B" />
  <!-- Central Security Keyhole in Portal -->
  <circle cx="250" cy="270" r="14" fill="#56B6C2" />
  <polygon points="245,275 255,275 258,320 242,320" fill="#56B6C2" />

  <!-- LEFT MAJESTIC LION STATUE Atop Left Pylon (Looking West) -->
  <g fill="#E5C07B" stroke="#090E17" stroke-width="1.5">
    <!-- Lion Silhouette sitting vigilant -->
    <path d="M 205,160 L 115,160 C 110,160 105,155 105,145 C 105,135 115,130 130,130 L 155,130 L 165,100 C 150,90 145,70 155,50 C 170,45 185,55 190,70 L 205,95 Z" />
    <path d="M 155,50 C 140,55 125,65 110,75 C 95,85 85,95 90,105 C 100,110 115,105 125,100 L 135,115" />
    <!-- Lion Ear -->
    <polygon points="175,45 185,30 165,38" />
    <!-- Eye -->
    <polygon points="135,70 145,67 140,75" fill="#090E17" />
    <!-- Nose -->
    <polygon points="90,100 100,100 95,105" fill="#090E17" />
  </g>

  <!-- RIGHT MAJESTIC LION STATUE Atop Right Pylon (Looking East - Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="#E5C07B" stroke="#090E17" stroke-width="1.5">
    <path d="M 205,160 L 115,160 C 110,160 105,155 105,145 C 105,135 115,130 130,130 L 155,130 L 165,100 C 150,90 145,70 155,50 C 170,45 185,55 190,70 L 205,95 Z" />
    <path d="M 155,50 C 140,55 125,65 110,75 C 95,85 85,95 90,105 C 100,110 115,105 125,100 L 135,115" />
    <polygon points="175,45 185,30 165,38" />
    <polygon points="135,70 145,67 140,75" fill="#090E17" />
    <polygon points="90,100 100,100 95,105" fill="#090E17" />
  </g>

  <!-- Ground Foundation Step -->
  <rect x="40" y="380" width="420" height="20" fill="#E5C07B" />
  <text x="250" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
  <text x="250" y="465" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="4" fill="#56B6C2" text-anchor="middle">THE CITADEL GATEWAY</text>
</svg>
