<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Concept: Cyber Circuit Lions -->
  <rect width="500" height="500" rx="20" fill="#0C1017" />
  
  <!-- Subtle Circuit Grid -->
  <g stroke="#182230" stroke-width="1.5">
    <line x1="50" y1="120" x2="450" y2="120" />
    <line x1="50" y1="250" x2="450" y2="250" />
    <line x1="50" y1="360" x2="450" y2="360" />
    <line x1="120" y1="50" x2="120" y2="450" />
    <line x1="250" y1="50" x2="250" y2="450" />
    <line x1="380" y1="50" x2="380" y2="450" />
  </g>

  <!-- Central Security Core (Octagon Vault Door) -->
  <polygon points="250,180 290,195 310,235 295,275 250,290 205,275 190,235 210,195" fill="#151D28" stroke="#56B6C2" stroke-width="4" />
  <circle cx="250" cy="235" r="16" fill="#E5C07B" />
  <circle cx="250" cy="235" r="6" fill="#0C1017" />

  <!-- LEFT CYBER LION PROFILE (Looking West - Explicit Feline Features) -->
  <g fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mane Outline -->
    <path d="M 200,200 L 150,180 L 130,130 L 105,130 L 85,155 L 95,190 L 130,210 L 110,240 L 130,270 L 180,270 L 205,275" />
    <!-- Jaw & Snout -->
    <path d="M 130,130 L 110,150 L 75,155 L 60,175 L 75,190 L 105,190 L 120,210" />
    <!-- Ear -->
    <polygon points="130,130 145,105 155,125" fill="#E5C07B" />
    <!-- Circuit Nodes -->
    <circle cx="75" cy="155" r="4" fill="#56B6C2" stroke="none" />
    <circle cx="60" cy="175" r="4" fill="#56B6C2" stroke="none" />
    <circle cx="105" cy="130" r="4" fill="#E5C07B" stroke="none" />
    <circle cx="110" cy="240" r="4" fill="#E5C07B" stroke="none" />
    <!-- Eye -->
    <polygon points="100,165 112,160 106,170" fill="#56B6C2" stroke="none" />
  </g>

  <!-- RIGHT CYBER LION PROFILE (Looking East - Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200,200 L 150,180 L 130,130 L 105,130 L 85,155 L 95,190 L 130,210 L 110,240 L 130,270 L 180,270 L 205,275" />
    <path d="M 130,130 L 110,150 L 75,155 L 60,175 L 75,190 L 105,190 L 120,210" />
    <polygon points="130,130 145,105 155,125" fill="#E5C07B" />
    <circle cx="75" cy="155" r="4" fill="#56B6C2" stroke="none" />
    <circle cx="60" cy="175" r="4" fill="#56B6C2" stroke="none" />
    <circle cx="105" cy="130" r="4" fill="#E5C07B" stroke="none" />
    <circle cx="110" cy="240" r="4" fill="#E5C07B" stroke="none" />
    <polygon points="100,165 112,160 106,170" fill="#56B6C2" stroke="none" />
  </g>

  <!-- Lower Horizon Line with Terminal Nodes -->
  <line x1="60" y1="340" x2="440" y2="340" stroke="#E5C07B" stroke-width="4" stroke-linecap="round" />
  <circle cx="60" cy="340" r="7" fill="#56B6C2" />
  <circle cx="440" cy="340" r="7" fill="#56B6C2" />
  <circle cx="250" cy="340" r="7" fill="#E5C07B" />

  <!-- Monospaced Terminal Title -->
  <text x="250" y="405" font-family="'Courier New', monospace" font-size="24" font-weight="900" letter-spacing="10" fill="#E5C07B" text-anchor="middle">AKERGATE</text>
  <text x="250" y="435" font-family="'Courier New', monospace" font-size="12" letter-spacing="5" fill="#56B6C2" text-anchor="middle">&lt;SEC_GATEWAY_PAM/&gt;</text>
</svg>
