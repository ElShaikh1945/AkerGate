<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 100% FLAT DESIGN - ZERO GRADIENTS -->
  <!-- Dark Obsidian Background -->
  <rect width="500" height="500" rx="24" fill="#0B0F17" />
  
  <!-- Outer Circular Seal Border -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#E5C07B" stroke-width="4" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#263345" stroke-width="2" />

  <!-- Circular Outer Text -->
  <path id="txtArc1" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
  <path id="txtArc2" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="5" fill="#E5C07B">
    <textPath href="#txtArc1" startOffset="50%" text-anchor="middle">AKERGATE SECURITY GATEWAY</textPath>
  </text>
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#56B6C2">
    <textPath href="#txtArc2" startOffset="50%" text-anchor="middle">LINUX PAM DUAL SENTINEL</textPath>
  </text>

  <!-- Central Plinth / Ground Bar (Earth Glyph) -->
  <rect x="100" y="325" width="300" height="14" rx="2" fill="#E5C07B" />
  <line x1="120" y1="345" x2="380" y2="345" stroke="#56B6C2" stroke-width="2.5" />

  <!-- Central Fortress Gateway Arch -->
  <path d="M 215,325 L 215,220 C 215,195 230,175 250,175 C 270,175 285,195 285,220 L 285,325 Z" fill="#151D28" stroke="#E5C07B" stroke-width="3" />
  <!-- Keyhole in Gateway -->
  <circle cx="250" cy="225" r="12" fill="#56B6C2" />
  <polygon points="246,230 254,230 257,265 243,265" fill="#56B6C2" />

  <!-- LEFT LION OF AKER (Looking West - Detailed Anatomy: Mane, Snout, Ears, Paws) -->
  <g fill="#E5C07B" stroke="#0B0F17" stroke-width="2">
    <!-- Foreleg & Resting Paw -->
    <path d="M 215,325 L 120,325 C 115,325 110,320 110,312 C 110,305 115,300 125,300 L 160,300 L 175,270 L 215,270 Z" />
    <!-- Paw Knuckles -->
    <line x1="120" y1="305" x2="120" y2="325" stroke="#0B0F17" stroke-width="2" />
    <line x1="130" y1="305" x2="130" y2="325" stroke="#0B0F17" stroke-width="2" />
    <line x1="140" y1="305" x2="140" y2="325" stroke="#0B0F17" stroke-width="2" />

    <!-- Lion Head & Mane Silhouette -->
    <!-- Mane Tufts -->
    <path d="M 215,270 C 190,265 170,250 160,230 C 150,215 145,195 150,175 C 135,185 130,205 135,225 C 120,215 115,190 125,170 C 110,180 100,165 105,145 C 110,125 130,115 155,120 C 170,105 195,105 210,115 L 215,120 Z" />
    
    <!-- Lion Face / Snout / Jaw -->
    <path d="M 170,125 C 155,125 140,135 135,148 C 125,150 115,155 105,165 C 95,175 90,190 100,200 C 105,205 115,205 125,200 C 125,210 135,220 148,220 C 158,220 168,212 175,200" />
    <!-- Lion Ear -->
    <path d="M 175,115 C 170,100 185,95 192,108 Z" fill="#E5C07B" stroke="#0B0F17" stroke-width="2" />
    <!-- Lion Eye (Almond Egyptian Feline Eye) -->
    <path d="M 140,162 C 145,156 155,156 160,162 C 155,168 145,168 140,162 Z" fill="#0B0F17" />
    <circle cx="150" cy="162" r="3" fill="#56B6C2" />
    <!-- Nose & Whiskers Line -->
    <polygon points="102,185 112,185 107,192" fill="#0B0F17" />
    <path d="M 107,192 C 112,198 120,198 125,195" fill="none" stroke="#0B0F17" stroke-width="2" />
  </g>

  <!-- RIGHT LION OF AKER (Looking East - Mirrored Anatomy) -->
  <g transform="translate(500, 0) scale(-1, 1)" fill="#E5C07B" stroke="#0B0F17" stroke-width="2">
    <!-- Foreleg & Resting Paw -->
    <path d="M 215,325 L 120,325 C 115,325 110,320 110,312 C 110,305 115,300 125,300 L 160,300 L 175,270 L 215,270 Z" />
    <line x1="120" y1="305" x2="120" y2="325" stroke="#0B0F17" stroke-width="2" />
    <line x1="130" y1="305" x2="130" y2="325" stroke="#0B0F17" stroke-width="2" />
    <line x1="140" y1="305" x2="140" y2="325" stroke="#0B0F17" stroke-width="2" />

    <!-- Mane & Head -->
    <path d="M 215,270 C 190,265 170,250 160,230 C 150,215 145,195 150,175 C 135,185 130,205 135,225 C 120,215 115,190 125,170 C 110,180 100,165 105,145 C 110,125 130,115 155,120 C 170,105 195,105 210,115 L 215,120 Z" />
    <path d="M 170,125 C 155,125 140,135 135,148 C 125,150 115,155 105,165 C 95,175 90,190 100,200 C 105,205 115,205 125,200 C 125,210 135,220 148,220 C 158,220 168,212 175,200" />
    <path d="M 175,115 C 170,100 185,95 192,108 Z" fill="#E5C07B" stroke="#0B0F17" stroke-width="2" />
    <!-- Lion Eye -->
    <path d="M 140,162 C 145,156 155,156 160,162 C 155,168 145,168 140,162 Z" fill="#0B0F17" />
    <circle cx="150" cy="162" r="3" fill="#56B6C2" />
    <!-- Nose -->
    <polygon points="102,185 112,185 107,192" fill="#0B0F17" />
    <path d="M 107,192 C 112,198 120,198 125,195" fill="none" stroke="#0B0F17" stroke-width="2" />
  </g>

  <!-- Hieroglyphic Solar Disk above the Gateway -->
  <circle cx="250" cy="135" r="22" fill="#E5C07B" stroke="#0B0F17" stroke-width="2" />
  <circle cx="250" cy="135" r="14" fill="#0B0F17" />
  <circle cx="250" cy="135" r="6" fill="#56B6C2" />
</svg>
