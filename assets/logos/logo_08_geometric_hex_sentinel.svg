  <!-- Cryptographic Keyhole Inside Keystone -->
  <circle cx="250" cy="235" r="14" fill="#E5C07B" />
  <polygon points="244,242 256,242 260,270 240,270" fill="#E5C07B" />
  <circle cx="250" cy="235" r="6" fill="#0C1017" />

