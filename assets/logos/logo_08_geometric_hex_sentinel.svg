  <circle cx="230" cy="300" r="5" fill="#56B6C2" />
  <circle cx="270" cy="300" r="5" fill="#56B6C2" />
  <line x1="250" y1="195" x2="250" y2="215" stroke="#56B6C2" stroke-width="2" />
  <line x1="230" y1="295" x2="242" y2="275" stroke="#56B6C2" stroke-width="2" />
  <line x1="270" y1="295" x2="258" y2="275" stroke="#56B6C2" stroke-width="2" />

