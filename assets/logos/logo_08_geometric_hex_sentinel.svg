  <polygon points="360,215 345,225 315,280 365,265" fill="#2E3D52" stroke="#0C1017" stroke-width="2" />
  <polygon points="285,225 250,210 250,285 315,280" fill="#C9A356" stroke="#0C1017" stroke-width="2" />
  <polygon points="365,265 315,280 330,335 380,320" fill="#1A2433" stroke="#0C1017" stroke-width="2" />
  <polygon points="315,280 250,285 250,345 330,335" fill="#2E3D52" stroke="#0C1017" stroke-width="2" />

